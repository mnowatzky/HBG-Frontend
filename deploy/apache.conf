# Included at the end of httpd.conf by the Dockerfile.
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule rewrite_module modules/mod_rewrite.so

AddDefaultCharset UTF-8

# No Apache version in the Server header and on error pages.
ServerTokens Prod
ServerSignature Off

<Directory "/usr/local/apache2/htdocs">
    # Serves /karte, /stats etc. from karte.html, stats.html etc.
    Options MultiViews
</Directory>

# 302, not 301: browsers would remember a permanent redirect even if / gets a page later.
RedirectMatch 302 "^/$" "/karte"

# The charts of /bar_chart are sections of /stats now; old links and bookmarks go there.
RewriteEngine On
RewriteCond %{QUERY_STRING} (^|&)data=countries(&|$)
RewriteRule "^/bar_chart(\.html)?$" "/stats#wo" [R=302,NE,QSD,L]
RewriteRule "^/bar_chart(\.html)?$" "/stats#ranglisten" [R=302,NE,QSD,L]

# Brotli for browsers that accept it, gzip for the rest. Responses the API has
# compressed already are left alone.
AddOutputFilterByType BROTLI_COMPRESS;DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/geo+json image/svg+xml

# The file names don't change when the files do, so pages, styles and scripts are
# checked on every load (cheap thanks to the ETag), and images and fonts are kept a week.
<LocationMatch "^/(bilder|css/fonts)/">
    Header set Cache-Control "public, max-age=604800"
</LocationMatch>
<LocationMatch "^/(?!bilder/|css/fonts/|api/)">
    Header set Cache-Control "no-cache"
</LocationMatch>

# HSTS belongs to the reverse proxy that terminates TLS.
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()"
# Report-only for now: violations show in the browser console but nothing is blocked.
# 'unsafe-inline' because the pages have inline scripts and onclick attributes. Mapbox
# needs blob: workers, api.mapbox.com for tiles, styles and search, and events.mapbox.com.
Header always set Content-Security-Policy-Report-Only "default-src 'self'; \
script-src 'self' 'unsafe-inline' https://api.mapbox.com; \
style-src 'self' 'unsafe-inline' https://api.mapbox.com; \
img-src 'self' data: blob: https://api.mapbox.com; \
font-src 'self'; \
connect-src 'self' https://api.mapbox.com https://events.mapbox.com; \
worker-src blob:; child-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# The browser talks to the API on the same origin, so no CORS is needed. The
# name is the service in docker-compose.yml of HBG-Fast-API.
# disablereuse makes it look up the name per request, so it keeps working when the
# API container restarts with a new IP. The timeouts let pages show an error
# quickly during an outage instead of waiting for Apache's default of a minute.
ProxyPass "/api/" "http://sticker-api:8000/" disablereuse=On connectiontimeout=3 timeout=30 retry=0
ProxyPassReverse "/api/" "http://sticker-api:8000/"
