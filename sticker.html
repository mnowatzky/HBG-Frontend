<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>HBG Sticker</title>

    <link rel="apple-touch-icon" sizes="57x57" href="/bilder/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/bilder/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/bilder/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/bilder/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/bilder/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/bilder/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/bilder/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/bilder/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/bilder/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/bilder/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/bilder/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/bilder/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/bilder/favicon/favicon-16x16.png">
    <link rel="stylesheet" href="css/main.css">


    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/bilder/favicon/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="js/sweetalert2.all.min.js"></script>
    <script src="js/api.js"></script>

    <script>
        const MAX_NAME_LENGTH = 75;
        // A position this old still puts the sticker about where the person is now
        const MAX_POSITION_AGE = 10000;
        const LOCATION_OPTIONS = {maximumAge: MAX_POSITION_AGE, timeout: 15000, enableHighAccuracy: true};

        // While the page is open, it keeps the latest position, so saving needn't wait for GPS.
        // Only once the location is allowed: the page never asks for it before the click.
        let latestPosition = null;
        let watchId = null;

        function watchLocation() {
            if (watchId !== null || !navigator.geolocation) return;
            watchId = navigator.geolocation.watchPosition(
                position => { latestPosition = position; },
                stopWatching,
                LOCATION_OPTIONS
            );
        }

        function stopWatching() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            latestPosition = null;
        }

        async function watchIfAllowed() {
            try {
                const permission = await navigator.permissions.query({name: 'geolocation'});
                if (permission.state === 'granted') watchLocation();
            } catch {
                // Without the Permissions API, the click gets the position
            }
        }

        function recentPosition() {
            const fresh = latestPosition && Date.now() - latestPosition.timestamp <= MAX_POSITION_AGE;
            return fresh ? latestPosition : null;
        }

        // A hidden page needs no position, and saves the battery
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) stopWatching(); else watchIfAllowed();
        });
        watchIfAllowed();

        function showError(msg) {
            Swal.fire({
                icon: 'error',
                title: 'Fehler',
                text: msg,
                showConfirmButton: false,
                showCancelButton: true,
                cancelButtonText: 'Abbrechen'
            });
        }

        function showSuccess(msg) {
            Swal.fire({
                icon: 'success',
                title: 'Fertig',
                text: msg,
                confirmButtonColor: '#55b6ff',
            });
        }

        function showLoading() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById("submit").disabled = true;
            document.getElementById("content").style.filter = 'blur(5px)';
        }

        function hideLoading() {
            document.getElementById('loader').style.display = 'none';
            document.getElementById("submit").disabled = false;
            document.getElementById("content").style.filter = 'none';
        }

        function getLocation() {
            const name = document.getElementById("name").value;

            //check name presence and length
            if (!name.trim()) {
                showError('Bitte gib einen Namen ein!');
            } else if (name.length > MAX_NAME_LENGTH) {
                showError('Der Name ist zu lang!');
            } else if (!navigator.onLine) {
                showError('Du bist nicht online!');
            }
            else {
                //get location
                if (navigator.geolocation) {
                    showLoading();
                    const position = recentPosition();
                    if (position) {
                        savePosition(position);
                    } else {
                        navigator.geolocation.getCurrentPosition(position => {
                            // Allowed now, so the next sticker needn't wait
                            watchLocation();
                            savePosition(position);
                        }, locationError, LOCATION_OPTIONS);
                    }
                } else {
                    showError('Standort kann nicht ermittelt werden');
                }
            }
        }

        function locationError(error) {
            hideLoading();
            if (error.code === error.PERMISSION_DENIED) {
                showError('Bitte erlaube den Zugriff auf deinen Standort');
            } else if (error.code === error.TIMEOUT) {
                showError('Standort konnte nicht rechtzeitig ermittelt werden, versuch es nochmal');
            } else {
                showError('Standort kann nicht ermittelt werden');
            }
        }

        function savePosition(position) {
            // The API adds the address and the time
            fetch(`${API_BASE_URL}/stickers`, {
                method: "POST",
                body: JSON.stringify({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude,
                    name: document.getElementById('name').value
                }),
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }
            }).then(function (response) {
                hideLoading();
                if (response.ok) {
                    showSuccess('Sticker gespeichert!');
                } else if (response.status === 429) {
                    showError('Zu viele Sticker auf einmal, versuch es gleich nochmal!');
                } else {
                    showError('Sticker konnte nicht gespeichert werden!');
                }
            }).catch(function (error) {
                hideLoading();
                showError('Sticker konnte nicht gespeichert werden!');
            });
        }
    </script>
</head>
<body>

    <main id="content">
        <h1 class="logo_heading"><img src="bilder/Sticker_header.svg" class="logo" alt="HBG Sticker"></h1><br>
        <div id="divider"></div>
        <label for="name" class="visually_hidden">Name</label>
        <input type="text" id="name" name="name" placeholder="Name (max. 75 Zeichen)" class="name" aria-describedby="name_hint"><br>
        <span id="name_hint" style="margin: 10px">Mehrere Namen mit "&" trennen</span>
        <br>
        <span>
            <button type="button" onclick="getLocation()" class="button" id="submit">Sticker speichern</button>
            <a href="/karte" class="button">Karte</a>
            <a href="/stats" class="button">Statistik</a>
        </span>
        <p style="margin: 10px"><a href="/datenschutz" class="footer_link">Datenschutz</a></p>
    </main>
    <div id="loader" style="display: none" role="status"><span class="visually_hidden">Sticker wird gespeichert</span></div>

</body>
</html>
