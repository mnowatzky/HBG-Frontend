name: CI

on: push

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hbg-frontend .
      - name: Serve every page
        run: |
          docker run -d --name frontend -p 8080:80 hbg-frontend
          sleep 2
          for path in / karte sticker stats 'bar_chart?data=names' js/api.js; do
            curl --fail --silent --show-error --output /dev/null "http://localhost:8080/$path"
          done
