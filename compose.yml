services:
  frontend:
    build: .
    # The reverse proxy forwards to this name over the proxy network.
    container_name: hbg-frontend
    restart: unless-stopped
    # Only for checks from the server itself or through an SSH tunnel.
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - hbg
      - proxy

networks:
  # Created by the compose project of HBG-Fast-API, start that one first.
  hbg:
    name: hbg
    external: true
  # The network of the reverse proxy that terminates TLS.
  proxy:
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env, see .env.example}
    external: true
