<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>HBG Karte</title>

    <link rel="apple-touch-icon" sizes="57x57" href="/bilder/favicon/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/bilder/favicon/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/bilder/favicon/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/bilder/favicon/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/bilder/favicon/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/bilder/favicon/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/bilder/favicon/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/bilder/favicon/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/bilder/favicon/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/bilder/favicon/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/bilder/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/bilder/favicon/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/bilder/favicon/favicon-16x16.png">

    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <script defer src='https://api.mapbox.com/mapbox-gl-js/v3.19.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v3.19.0/mapbox-gl.css' rel='stylesheet' />
    <!-- Load the `mapbox-gl-geocoder` plugin. -->
    <script defer
        src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
    <link rel="stylesheet"
        href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.css"
        type="text/css">
    <script src="js/api.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #static {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
            background: hsl(200, 100%, 80%) center no-repeat;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #load_error {
            display: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            padding: 8px 16px;
            border-radius: 4px;
            background: #ffffff;
            color: #c00000;
            font-family: sans-serif;
        }

        .marker {
            display: block;
            border: none;
            cursor: pointer;
            padding: 0;
            background-image: url("/bilder/hbg-marker.svg");
            background-size: cover;
            width: 30px;
            height: 30px;
        }
    </style>
</head>

<body>
    <div id="static"></div>
    <div id='map'></div>
    <div id="load_error">Sticker konnten nicht geladen werden</div>

    <script>
        const mapboxToken = 'pk.eyJ1IjoicGl4bHBhaW50ZXIiLCJhIjoiY2p1bWV5ZjVtMHZiaDRmbDg3cW1ubmx3NCJ9.X5FRsatkHE11P2Zwk8zN0w';
        const markerHeight = 25;
        const popupOffsets = { 'bottom': [0, -markerHeight] };

        // bar_chart links here with ?name= to show the stickers of one person
        const selectedName = new URLSearchParams(window.location.search).get('name');
        const stickerQuery = { format: 'geojson', ...(selectedName && { name: selectedName }) };

        function showLoadError(error) {
            console.error(error);
            document.getElementById('load_error').style.display = 'block';
        }

        function getMapCenter(newest_sticker) {
            // Default coordinates if no stickers are available
            return newest_sticker ? newest_sticker.geometry.coordinates : [10.4541194, 51.1642292];
        }

        // A picture of the map to look at while the Mapbox library loads. Not @2x, which is
        // bigger than the library. The API allows up to 1280 px, so it stays at its real size
        // to line up with the map on larger screens.
        function showStaticMap([long, lat]) {
            const element = document.getElementById('static');
            const width = Math.min(element.clientWidth, 1280);
            const height = Math.min(element.clientHeight, 1280);
            element.style.backgroundImage = `url(https://api.mapbox.com/styles/v1/pixlpainter/clda7ilh1000i01ofotpgomzu/static/${long},`
                + `${lat},5/${width}x${height}?logo=false&access_token=${mapboxToken})`;
            element.style.backgroundSize = `${width}px ${height}px`;
        }

        const newestStickerResponse = fetchStickers({ ...stickerQuery, limit: 1 }).catch(error => {
            showLoadError(error);
            return { stickers: [], total: 0 };
        });
        newestStickerResponse.then(({ stickers }) => showStaticMap(getMapCenter(stickers[0])));

        // The deferred Mapbox scripts have run by the time the DOM is ready.
        const mapboxLoaded = new Promise(resolve => document.addEventListener('DOMContentLoaded', resolve));

        Promise.all([newestStickerResponse, mapboxLoaded]).then(([{ stickers: newestStickers, total }]) => {
            const newest_sticker = newestStickers[0];
            mapboxgl.accessToken = mapboxToken;

            const map = new mapboxgl.Map({
                container: 'map', // container ID
                style: 'mapbox://styles/pixlpainter/clda7ilh1000i01ofotpgomzu', // style URL
                center: getMapCenter(newest_sticker), // starting position [lng, lat]
                zoom: 5, // starting zoom
                attributionControl: false,
                fadeDuration: 0 // show markers at once
            });
            // Add search control to the map.
            map.addControl(
                new MapboxGeocoder({
                    accessToken: mapboxgl.accessToken,
                    mapboxgl: mapboxgl
                })
            );
            // zoom map to user location control
            map.addControl(new mapboxgl.GeolocateControl({
                positionOptions: {
                    enableHighAccuracy: true
                },
                trackUserLocation: true,
                showUserHeading: true
            }));
            // add fullscreen control
            map.addControl(new mapboxgl.FullscreenControl({
                container: document.querySelector('body')
            }));
            // Add zoom and rotation controls to the map.
            map.addControl(new mapboxgl.NavigationControl());
            // Not `load`, which also waits for the map tiles
            map.on('style.load', () => {
                // Until the tiles are there, the static map shows through the map's background
                const backgroundLayers = map.getStyle().layers.filter(layer => layer.type === 'background');
                backgroundLayers.forEach(layer => map.setLayoutProperty(layer.id, 'visibility', 'none'));
                map.once('load', () => {
                    backgroundLayers.forEach(layer => map.setLayoutProperty(layer.id, 'visibility', 'visible'));
                    document.getElementById('static').remove();
                });

                // Add source for marker geo data
                map.addSource('stickers', { type: 'geojson', data: { type: "FeatureCollection", features: newestStickers } });
                // Add a symbol layer for HBG markers
                map.addLayer({
                    'id': 'stickers',
                    'type': 'symbol',
                    'source': 'stickers',
                    'layout': {
                        'icon-image': 'hbg-marker',
                        'icon-allow-overlap': true,
                        'icon-anchor': 'bottom',
                        'icon-size': 0.3,
                        'icon-padding': 0
                    }
                });
                //open Popup for newest sticker
                if (newest_sticker) {
                    new mapboxgl.Popup({ offset: popupOffsets })
                        .setLngLat([newest_sticker.geometry.coordinates[0], newest_sticker.geometry.coordinates[1]])
                        .setHTML(makePopupDescription(newest_sticker.properties, total, total))
                        .addTo(map);
                }

                // asynchronously fetch all stickers and update source data paginated
                const stickerNumbers = new Map(newestStickers.map(sticker => [sticker.properties.id, total]));

                (async () => {
                    const allStickers = [];
                    for await (const page of fetchAllStickers(stickerQuery)) {
                        for (const sticker of page) {
                            // pages arrive newest first, so the position gives the number
                            stickerNumbers.set(sticker.properties.id, total - allStickers.length);
                            allStickers.push(sticker);
                        }
                        map.getSource('stickers').setData({ type: "FeatureCollection", features: allStickers });
                    }
                })().catch(showLoadError);

                // show Stickercount
                map.addControl(new mapboxgl.AttributionControl({
                    customAttribution: `Sticker gesamt: ${total}`
                }));

                // When a click event occurs on a feature in the stickers layer, open a popup at the
                // location of the feature, with description HTML from its properties.
                map.on('click', 'stickers', (e) => {
                    // Copy coordinates array.
                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const number = stickerNumbers.get(e.features[0].properties.id);
                    const description = makePopupDescription(e.features[0].properties, number, total);

                    // Ensure that if the map is zoomed out such that multiple
                    // copies of the feature are visible, the popup appears
                    // over the copy being pointed to.
                    if (['mercator', 'equirectangular'].includes(map.getProjection().name)) {
                        while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                            coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                        }
                    }
                    // add Popup
                    new mapboxgl.Popup({ offset: popupOffsets })
                        .setLngLat(coordinates)
                        .setHTML(description)
                        .addTo(map);
                });

                // Change the cursor to a pointer when the mouse is over the places layer.
                map.on('mouseenter', 'stickers', () => {
                    map.getCanvas().style.cursor = 'pointer';
                });

                // Change it back when it leaves.
                map.on('mouseleave', 'stickers', () => {
                    map.getCanvas().style.cursor = '';
                });
            });
        });

        function makePopupDescription(sticker, number, count) {
            const name = escapeHtml(sticker.name);
            if (number === count) {
                return `<b>Neuster Sticker</b><br>von ${name}`;
            } else if (number % 100 === 0 || number === 1) {
                return `<b>Sticker Nr. ${number}</b><br>von ${name}`;
            } else if (number === 69) {
                return `<b>Sticker Nr. ${number}</b><br>von ${name} (nice)`;
            } else if (number === 420) {
                return `<b>420 blaze it</b><br>von ${name}`;
            }
            else {
                return `Von ${name}`;
            }
        }
    </script>
</body>

</html>
